name: Pull Request Check

on: pull_request

jobs:

  AndroidTest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
    # ── Fork patch (applied at build time; llama.cpp is a PINNED submodule, so a
    # committed working-tree edit would be reset by the recursive checkout above) ──
    # The pinned mtmd (b9496) hits GGML_ABORT("Unknown projector type") in
    # clip_n_mmproj_embd when loading a COMBINED vision+audio projector (e.g. the
    # Gemma 3n / Gemma 4 E2B mmproj): clip builds the audio context, whose audio
    # projector type this version's switch doesn't handle, and aborts the whole
    # :llama process. This app is vision-only, so skip the audio encoder whenever a
    # vision encoder is present. Verified: the step fails if the target line isn't
    # found or the edit doesn't take, so we never ship an unpatched (crashing) build.
    - name: Patch mtmd — skip audio encoder (vision-only)
      run: |
        set -euo pipefail
        f=app/src/main/cpp/llama.cpp/tools/mtmd/clip.cpp
        grep -q 'skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;' "$f"
        sed -i 's|skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;|skip_audio = true; // fork: vision-only app — skip the unused/unsupported audio encoder|' "$f"
        grep -q 'skip_audio = true;' "$f"
        echo "mtmd patched: $(grep -n 'skip_audio = true;' "$f" | head -1)"
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    # Vulkan (GGML_VULKAN=ON) host build deps — see build-debug-apk.yml for why.
    # Vulkan is used ONLY for the mtmd/CLIP vision encoder; the LLM stays on CPU.
    - name: Set up Vulkan toolchain for the native build
      run: |
        set -eu
        SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
        printf 'y\n' | "$SDKMANAGER" --install "ndk;27.2.12479018" >/dev/null
        GLSLC="$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc"
        test -x "$GLSLC"
        echo "VULKAN_GLSLC=$GLSLC" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev spirv-headers
        VKINC="$RUNNER_TEMP/vk-headers/include"
        mkdir -p "$VKINC"
        for d in vulkan vk_video spirv; do
          [ -d "/usr/include/$d" ] && cp -r "/usr/include/$d" "$VKINC/"
        done
        test -f "$VKINC/vulkan/vulkan.hpp"
        test -f "$VKINC/spirv/unified1/spirv.hpp"
        SPIRV_CFG="$(find /usr -name SPIRV-HeadersConfig.cmake 2>/dev/null | head -1)"
        test -n "$SPIRV_CFG"
        echo "VULKAN_HEADERS_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_INCLUDE_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"
    - name: Run connected android tests
      run: ./gradlew app:mvdApi35Check
