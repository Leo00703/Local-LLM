name: Deploy to Google Play Internal

on:
  # Manual-only: this personal fork has no Google Play release secrets, so an
  # automatic run on every push to main just burns a ~13 min native build and
  # then fails at signing/upload. Kept dispatchable in case a real Play release
  # is ever wired up.
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # ── Fork patch (applied at build time; llama.cpp is a PINNED submodule, so a
    # committed working-tree edit would be reset by the recursive checkout above) ──
    # The pinned mtmd (b9496) hits GGML_ABORT("Unknown projector type") in
    # clip_n_mmproj_embd when loading a COMBINED vision+audio projector (e.g. the
    # Gemma 3n / Gemma 4 E2B mmproj): clip builds the audio context, whose audio
    # projector type this version's switch doesn't handle, and aborts the whole
    # :llama process. This app is vision-only, so skip the audio encoder whenever a
    # vision encoder is present. Verified: the step fails if the target line isn't
    # found or the edit doesn't take, so we never ship an unpatched (crashing) build.
    - name: Patch mtmd — skip audio encoder (vision-only)
      run: |
        set -euo pipefail
        f=app/src/main/cpp/llama.cpp/tools/mtmd/clip.cpp
        grep -q 'skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;' "$f"
        sed -i 's|skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;|skip_audio = true; // fork: vision-only app — skip the unused/unsupported audio encoder|' "$f"
        grep -q 'skip_audio = true;' "$f"
        echo "mtmd patched: $(grep -n 'skip_audio = true;' "$f" | head -1)"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # OpenCL (GGML_OPENCL=ON, arm64) host build deps — see build-debug-apk.yml for why.
    - name: Set up OpenCL toolchain for the native build
      run: |
        set -eu
        NDK="$ANDROID_HOME/ndk/27.2.12479018"
        SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        test -d "$SYSROOT"
        sudo apt-get update
        sudo apt-get install -y ninja-build
        WORK="$RUNNER_TEMP/opencl"
        mkdir -p "$WORK" && cd "$WORK"
        git clone --depth 1 --branch v2025.07.22 https://github.com/KhronosGroup/OpenCL-Headers
        cp -r OpenCL-Headers/CL "$SYSROOT/usr/include/"
        git clone --depth 1 --branch v2025.07.22 https://github.com/KhronosGroup/OpenCL-ICD-Loader
        cmake -S OpenCL-ICD-Loader -B OpenCL-ICD-Loader/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
          -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=24 \
          -DANDROID_STL=c++_static
        cmake --build OpenCL-ICD-Loader/build
        LIB="$WORK/OpenCL-ICD-Loader/build/libOpenCL.so"
        test -f "$LIB"
        # Link-only (see build-debug-apk.yml): staged into the sysroot for the
        # link step, NOT bundled — the app uses the device's vendor OpenCL driver.
        cp "$LIB" "$SYSROOT/usr/lib/aarch64-linux-android/"
        echo "OpenCL toolchain ready (link-only; runtime uses the device driver)."

    - name: Setup Ruby (for fastlane)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Decode keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/keystore.jks

    - name: Build release bundle
      run: ./gradlew bundleRelease
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        LM_PLAYGROUND_KEY_ALIAS: ${{ secrets.LM_PLAYGROUND_KEY_ALIAS }}
        LM_PLAYGROUND_KEY_PASSWORD: ${{ secrets.LM_PLAYGROUND_KEY_PASSWORD }}

    - name: Write service account JSON
      run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/play-sa.json"

    # Fastlane looks for fastlane/metadata/android/*/changelogs/{versionCode}.txt.
    # We keep one file per versionName (e.g. 10500.txt for 1.5.0) and copy it
    # to the exact versionCode filename so every deploy ships release notes.
    # If a release has no version-specific changelog, fall back to the
    # locale's default.txt ("performance and stability improvements") so
    # internal-only patches still ship localized notes.
    # Version is the single source of truth in version.properties (shared with gradle).
    - name: Stage changelog for build
      run: |
        source version.properties
        BASE=$((major * 10000 + minor * 100 + patch))
        VERSION_CODE=$((BASE * 1000 + GITHUB_RUN_NUMBER))
        SOURCE_NAME="${BASE}.txt"
        echo "version=$major.$minor.$patch, versionCode=$VERSION_CODE, source=$SOURCE_NAME"
        for dir in fastlane/metadata/android/*/changelogs; do
          if [ -f "$dir/$SOURCE_NAME" ]; then
            cp "$dir/$SOURCE_NAME" "$dir/${VERSION_CODE}.txt"
          elif [ -f "$dir/default.txt" ]; then
            cp "$dir/default.txt" "$dir/${VERSION_CODE}.txt"
          fi
        done

    - name: Upload AAB + changelog to Play Store
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-sa.json
      run: bundle exec fastlane deploy_internal

    - name: Cleanup secrets
      if: always()
      run: |
        rm -f ~/.android/keystore.jks
        rm -f "$RUNNER_TEMP/play-sa.json"
