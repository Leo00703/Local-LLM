name: Build Debug APK

# Builds an installable, debug-signed APK and uploads it as a downloadable
# artifact so it can be sideloaded onto a device without a local Android
# toolchain. Runs on every push to a non-main branch (main is handled by
# deploy-internal.yml) and can also be triggered manually from the Actions tab.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ── Android patches for llama.cpp (applied at build time) ──
    # llama.cpp is a submodule pinned to a ggml-org release tag, and a committed edit inside it would be
    # reset by the recursive checkout above, so the app's few changes live as patch files in
    # app/src/main/cpp/patches/llama.cpp (see the README there). `git apply` fails the step when one no
    # longer applies, so a llama.cpp bump that breaks a patch is caught here instead of shipping an
    # engine that cannot open the model folder.
    - name: Apply Android patches to llama.cpp
      run: |
        set -euo pipefail
        cd app/src/main/cpp/llama.cpp
        for p in ../patches/llama.cpp/*.patch; do
          echo "applying $p"
          git apply --verbose "$p"
        done
        git status --short

    # ── Fork patch (applied at build time; llama.cpp is a PINNED submodule, so a
    # committed working-tree edit would be reset by the recursive checkout above) ──
    # The pinned mtmd (seen on b9496; the target line is unchanged through b11393) hits GGML_ABORT("Unknown projector type") in
    # clip_n_mmproj_embd when loading a COMBINED vision+audio projector (e.g. the
    # Gemma 3n / Gemma 4 E2B mmproj): clip builds the audio context, whose audio
    # projector type this version's switch doesn't handle, and aborts the whole
    # :llama process. This app is vision-only, so skip the audio encoder whenever a
    # vision encoder is present. Verified: the step fails if the target line isn't
    # found or the edit doesn't take, so we never ship an unpatched (crashing) build.
    - name: Patch mtmd — skip audio encoder (vision-only)
      run: |
        set -euo pipefail
        f=app/src/main/cpp/llama.cpp/tools/mtmd/clip.cpp
        grep -q 'skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;' "$f"
        sed -i 's|skip_audio = ctx_vision->model.proj_type == PROJECTOR_TYPE_GEMMA3NV;|skip_audio = true; // fork: vision-only app — skip the unused/unsupported audio encoder|' "$f"
        grep -q 'skip_audio = true;' "$f"
        echo "mtmd patched: $(grep -n 'skip_audio = true;' "$f" | head -1)"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default also installs the legacy "tools" package, which the SDK
        # repository no longer serves; sdkmanager then fails the job.
        packages: 'platform-tools'

    # Diagnostics: surface which CMake/NDK packages the runner can install, as
    # annotations (readable via the API), so a native tool-resolution failure
    # is debuggable without downloading logs.
    - name: Probe SDK packages
      run: |
        echo "::group::Available cmake / ndk 27 packages"
        sdkmanager --list 2>/dev/null | grep -iE "cmake|ndk;27" | sed 's/^[[:space:]]*//' | sort -u | tee sdk-pkgs.txt
        echo "::endgroup::"
        while IFS= read -r l; do [ -n "$l" ] && echo "::warning title=sdk-pkg::$l"; done < sdk-pkgs.txt || true

    # Pre-install the pinned NDK. CMake is left to AGP for now; if it fails to
    # resolve CMake 3.31.6, the "Surface failure" step below reports it.
    - name: Install pinned NDK and CMake
      run: yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.5" >/dev/null 2>&1 || echo "::warning::sdkmanager install returned non-zero"

    # OpenCL (GGML_OPENCL=ON, arm64) needs host build-time deps the NDK doesn't
    # ship: the OpenCL headers to compile against and a libOpenCL.so to link
    # against. Install the Khronos OpenCL-Headers into the NDK sysroot and build
    # the Khronos ICD loader (libOpenCL.so) for arm64, staged into the sysroot
    # for the LINK step only. It is NOT bundled in the APK: at runtime the app
    # loads the device's own vendor OpenCL driver (uses-native-library in the
    # manifest). Kernels embed via Python3 (already on the runner). This replaces
    # the earlier Vulkan path, which crashed on Adreno 830.
    - name: Set up OpenCL toolchain for the native build
      run: |
        set -eu
        NDK="$ANDROID_HOME/ndk/27.2.12479018"
        SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        test -d "$SYSROOT"
        sudo apt-get update
        sudo apt-get install -y ninja-build
        WORK="$RUNNER_TEMP/opencl"
        mkdir -p "$WORK" && cd "$WORK"
        git clone --depth 1 --branch v2025.07.22 https://github.com/KhronosGroup/OpenCL-Headers
        cp -r OpenCL-Headers/CL "$SYSROOT/usr/include/"
        git clone --depth 1 --branch v2025.07.22 https://github.com/KhronosGroup/OpenCL-ICD-Loader
        cmake -S OpenCL-ICD-Loader -B OpenCL-ICD-Loader/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
          -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=24 \
          -DANDROID_STL=c++_static
        cmake --build OpenCL-ICD-Loader/build
        LIB="$WORK/OpenCL-ICD-Loader/build/libOpenCL.so"
        test -f "$LIB"
        # Link-only: staged into the NDK sysroot for find_package(OpenCL). We do
        # NOT bundle it in jniLibs — the app loads the device's own vendor OpenCL
        # driver at runtime (uses-native-library in the manifest), and a bundled
        # libOpenCL.so would shadow it with a loader that finds no GPU on Android.
        cp "$LIB" "$SYSROOT/usr/lib/aarch64-linux-android/"
        echo "OpenCL toolchain ready (link-only; runtime uses the device driver)."

    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

    # On failure, echo Gradle's "What went wrong" block and any native
    # tool-resolution lines into annotations so they can be read via the API.
    - name: Surface Gradle failure
      if: failure()
      run: |
        echo "::group::build.log tail (last 250 lines)"
        tail -n 250 build.log || true
        echo "::endgroup::"
        # The real CMake configure error sits just before "Configuring incomplete".
        LINE=$(grep -n "Configuring incomplete" build.log | head -1 | cut -d: -f1)
        if [ -n "$LINE" ]; then
          START=$(( LINE > 120 ? LINE - 120 : 1 ))
          echo "::group::CMake error window"; sed -n "${START},${LINE}p" build.log; echo "::endgroup::"
          sed -n "${START},${LINE}p" build.log \
            | grep -iE "CMake Error|error:|fatal error|could not find|cannot find|no such file|unsupported|required|missing|not set|undefined reference" \
            | grep -vE "CMAKE_EXPORT_COMPILE|CMAKE_SYSTEM|^[[:space:]]*-D" \
            | head -n 30 | while IFS= read -r l; do echo "::error title=cmake::$l"; done
        fi
        # CMake's own check logs, if present
        for f in $(find app/.cxx -name "CMakeError.log" 2>/dev/null | head -2); do
          grep -iE "error|failed|could not|not found|unsupported" "$f" 2>/dev/null | head -n 15 | while IFS= read -r l; do echo "::error title=CMakeError::$l"; done
        done
        # Gradle 'What went wrong'
        awk '/What went wrong:/{f=1} f{print} /^\* Try:/{f=0}' build.log | head -n 15 | while IFS= read -r l; do
          [ -n "$l" ] && echo "::error title=gradle::$l"
        done

    # ABI splits are enabled, so this produces app-arm64-v8a-debug.apk
    # (for phones like the Xiaomi 15), app-x86_64-debug.apk (emulators),
    # and app-universal-debug.apk. All are uploaded; install the arm64-v8a one.
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: lmplayground-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    # Native debug symbols for the arm64 libs we build (llama.cpp + JNI), so a
    # native tombstone can be symbolicated locally with ndk-stack. Broad globs so
    # this survives AGP output-path differences; unstripped merged_native_libs are
    # the reliable ndk-stack input. The prebuilt LiteRT .so is stripped upstream
    # and won't appear here. Never fails the build (symbols are a convenience).
    - name: Upload native debug symbols (arm64)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: native-debug-symbols-arm64
        path: |
          app/build/outputs/native-debug-symbols/**/*.zip
          app/build/intermediates/merged_native_libs/**/arm64-v8a/*.so
        if-no-files-found: warn

  # JVM unit tests (no device, no native build). They run in parallel with the APK
  # build so a slow suite never delays the installable APK.
  #
  # First run (v1.9.111): 89 tests, 0 failures, so this job now FAILS THE RUN when a
  # test breaks. It briefly had continue-on-error while the suite's state was
  # unknown; if a test is ever knowingly red, fix or @Ignore it rather than
  # re-adding that, otherwise regressions go unnoticed again.
  #
  # -PskipScreenshots excludes the Paparazzi store-screenshot scenes (their golden
  # snapshots are not tracked in git); see the Test task config in app/build.gradle.kts.
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default also installs the legacy "tools" package, which the SDK
        # repository no longer serves; sdkmanager then fails the job.
        packages: 'platform-tools'

    # AGP resolves the pinned NDK/CMake when it configures the module even though
    # no native code is built here, so install the same pair as the build job.
    - name: Install pinned NDK and CMake
      run: yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.5" >/dev/null 2>&1 || echo "::warning::sdkmanager install returned non-zero"

    - name: Run unit tests
      run: |
        set -o pipefail
        ./gradlew app:testDebugUnitTest -PskipScreenshots --stacktrace 2>&1 | tee test.log

    # Always report the totals, and on failure list every failing test as an
    # annotation so the result can be read through the API without the logs.
    - name: Summarize test results
      if: always()
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        tests = failures = errors = skipped = 0
        for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
            root = ET.parse(f).getroot()
            for tc in root.iter("testcase"):
                tests += 1
                if tc.find("skipped") is not None:
                    skipped += 1
                for kind in ("failure", "error"):
                    for e in tc.findall(kind):
                        if kind == "failure": failures += 1
                        else: errors += 1
                        msg = (e.get("message") or "").replace("\n", " ")[:300]
                        print(f"::error title=unit-test::{tc.get('classname')}.{tc.get('name')}: {msg}")
        print(f"::notice title=unit-test-summary::{tests} tests, {failures} failures, {errors} errors, {skipped} skipped")
        PY
        # Compilation problems never reach the XML; surface Gradle's own message.
        awk '/What went wrong:/{f=1} f{print} /^\* Try:/{f=0}' test.log | head -n 15 | while IFS= read -r l; do
          [ -n "$l" ] && echo "::error title=gradle-test::$l"
        done || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: app/build/test-results/testDebugUnitTest/*.xml
        if-no-files-found: warn
